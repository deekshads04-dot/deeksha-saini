name: Deploy to GitHub Pages

on:
  push:
    branches: [main, development]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Pages URL env
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          pages_repo="${owner}.github.io"
          if [ "$repo" = "$pages_repo" ]; then
            site_url="https://${owner}.github.io"
            base_path=""
          else
            site_url="https://${owner}.github.io/${repo}"
            base_path="/${repo}"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "Pages build env: repo=${repo} site=${site_url} basePath=${base_path:-<empty>}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Optional SITE_URL for custom domains only (must not include a stale /deeksha-saini path)
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || env.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
